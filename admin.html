<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Content Studio — Dr. Rick Wolthusen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
  :root{
    --bg:#070b14; --bg-2:#0b1120; --panel:#101827; --panel-2:#141d2f;
    --line:rgba(255,255,255,.08); --line-2:rgba(255,255,255,.14);
    --text:#e8edf7; --muted:#93a1b8; --dim:#66748c;
    --blue:#5b9bff; --emerald:#34d399; --amber:#fbbf24; --rose:#fb7185;
    --radius:16px; --shadow:0 18px 50px rgba(0,0,0,.45);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    font-size:14.5px; line-height:1.55; -webkit-font-smoothing:antialiased;
  }
  body::before{
    content:''; position:fixed; inset:0; pointer-events:none; z-index:0;
    background:
      radial-gradient(900px 500px at 12% -8%, rgba(91,155,255,.16), transparent 60%),
      radial-gradient(700px 420px at 96% 4%, rgba(52,211,153,.11), transparent 60%);
  }
  a{color:var(--blue);text-decoration:none}
  button{font:inherit;color:inherit}
  .hidden{display:none!important}

  /* ---------------------------------------------------------------- login */
  #login{position:relative;z-index:1;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
  .login-card{
    width:100%;max-width:410px;background:linear-gradient(180deg,rgba(20,29,47,.96),rgba(12,18,32,.96));
    border:1px solid var(--line);border-radius:24px;padding:38px 34px;box-shadow:var(--shadow);
  }
  .brand{display:flex;align-items:center;gap:12px;margin-bottom:26px}
  .brand-mark{
    width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg,var(--blue),var(--emerald));color:#06101f;font-weight:800;font-size:18px;
    box-shadow:0 10px 26px rgba(91,155,255,.32);
  }
  .brand-name{font-weight:700;font-size:16px;letter-spacing:-.01em}
  .brand-sub{font-size:12px;color:var(--dim)}
  .login-card h1{margin:0 0 6px;font-size:22px;letter-spacing:-.02em}
  .login-card p.sub{margin:0 0 26px;color:var(--muted);font-size:13.5px}
  .login-foot{margin-top:22px;font-size:12px;color:var(--dim);text-align:center}

  /* ---------------------------------------------------------------- shell */
  #app{position:relative;z-index:1;min-height:100vh;display:grid;grid-template-columns:264px 1fr;grid-template-rows:auto 1fr}
  .topbar{
    grid-column:1/-1;display:flex;align-items:center;gap:14px;padding:12px 20px;
    border-bottom:1px solid var(--line);background:rgba(9,14,25,.86);backdrop-filter:blur(14px);
    position:sticky;top:0;z-index:20;
  }
  .topbar .grow{flex:1}
  .who{display:flex;align-items:center;gap:9px;padding:6px 12px 6px 6px;border:1px solid var(--line);border-radius:999px;background:rgba(255,255,255,.03)}
  .avatar{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,rgba(91,155,255,.9),rgba(52,211,153,.9));color:#06101f;font-weight:700;font-size:12px}
  .who-name{font-size:13px;font-weight:600;line-height:1.1}
  .who-role{font-size:11px;color:var(--dim);line-height:1.2}
  .pill{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:3px 9px;border-radius:999px;border:1px solid var(--line-2);color:var(--muted)}
  .pill.super{border-color:rgba(52,211,153,.45);color:#5eead4}

  .sidebar{border-right:1px solid var(--line);padding:18px 12px 120px;background:rgba(10,15,27,.6);overflow-y:auto;max-height:calc(100vh - 61px);position:sticky;top:61px}
  .side-label{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);padding:12px 12px 6px;font-weight:700}
  .navbtn{
    display:flex;align-items:center;gap:11px;width:100%;padding:9.5px 12px;border:0;border-radius:11px;
    background:transparent;cursor:pointer;color:var(--muted);text-align:left;font-size:13.5px;transition:background .15s,color .15s;
  }
  .navbtn i{width:17px;text-align:center;font-size:13px;opacity:.85}
  .navbtn:hover{background:rgba(255,255,255,.045);color:var(--text)}
  .navbtn.on{background:linear-gradient(90deg,rgba(91,155,255,.18),rgba(91,155,255,.04));color:#dce9ff;box-shadow:inset 2px 0 0 var(--blue)}
  .navbtn .count{margin-left:auto;font-size:11px;color:var(--dim)}
  .side-sep{height:1px;background:var(--line);margin:12px 10px}

  .main{padding:28px 32px 140px;max-width:900px}
  .panel-head{margin-bottom:22px}
  .panel-head h2{margin:0 0 4px;font-size:23px;letter-spacing:-.02em}
  .panel-head p{margin:0;color:var(--muted);font-size:13.5px;max-width:640px}

  .card{background:linear-gradient(180deg,rgba(20,29,47,.7),rgba(13,19,33,.7));border:1px solid var(--line);border-radius:var(--radius);padding:20px;margin-bottom:18px}
  .card > h3{margin:0 0 3px;font-size:15px}
  .card > .hint{margin-bottom:16px}

  /* ---------------------------------------------------------------- fields */
  .fld{margin-bottom:16px}
  .fld:last-child{margin-bottom:0}
  .fld-label{display:block;font-size:12.5px;font-weight:600;color:#c3cfe2;margin-bottom:6px}
  .inp{
    width:100%;padding:10px 12px;background:rgba(6,10,19,.75);border:1px solid var(--line-2);
    border-radius:11px;color:var(--text);font:inherit;font-size:13.5px;outline:none;transition:border-color .15s,box-shadow .15s;
  }
  .inp:focus{border-color:rgba(91,155,255,.7);box-shadow:0 0 0 3px rgba(91,155,255,.14)}
  textarea.inp{resize:vertical;min-height:78px;line-height:1.6}
  textarea.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px}
  select.inp{appearance:none;background-image:linear-gradient(45deg,transparent 50%,#7b8aa3 50%),linear-gradient(135deg,#7b8aa3 50%,transparent 50%);background-position:calc(100% - 17px) 50%,calc(100% - 12px) 50%;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:34px}
  .hint{font-size:11.5px;color:var(--dim);margin-top:4px}
  .fld-inline{display:flex;gap:10px;align-items:center}
  .fld-inline .inp{flex:1}
  input[type=checkbox]{width:17px;height:17px;accent-color:var(--blue);margin:0}

  .btn{
    display:inline-flex;align-items:center;gap:8px;padding:9px 15px;border-radius:11px;border:1px solid var(--line-2);
    background:rgba(255,255,255,.04);cursor:pointer;font-size:13px;font-weight:600;transition:background .15s,border-color .15s,transform .1s;
    white-space:nowrap;
  }
  .btn:hover{background:rgba(255,255,255,.09)}
  .btn:active{transform:translateY(1px)}
  .btn-sm{padding:6.5px 11px;font-size:12.5px;border-radius:9px}
  .btn-primary{background:linear-gradient(135deg,var(--blue),#3f7fe0);border-color:transparent;color:#04101f;box-shadow:0 8px 22px rgba(91,155,255,.26)}
  .btn-primary:hover{background:linear-gradient(135deg,#7cb0ff,#4f8ce8)}
  .btn-primary:disabled{opacity:.55;cursor:progress;transform:none}
  .btn-ghost{background:transparent}
  .btn-danger{color:#ffc9d2;border-color:rgba(251,113,133,.4)}
  .btn-danger:hover{background:rgba(251,113,133,.14)}
  .btn-block{width:100%;justify-content:center;padding:12px}
  .iconbtn{
    width:29px;height:29px;display:inline-flex;align-items:center;justify-content:center;border-radius:8px;
    border:1px solid var(--line);background:rgba(255,255,255,.03);cursor:pointer;color:var(--muted);font-size:12px;
  }
  .iconbtn:hover{background:rgba(255,255,255,.1);color:var(--text)}
  .iconbtn.danger:hover{background:rgba(251,113,133,.16);color:#ffc9d2;border-color:rgba(251,113,133,.4)}

  /* ---------------------------------------------------------------- lists */
  .list-head{display:flex;align-items:flex-start;gap:14px;margin-bottom:13px}
  .list-head > div:first-child{flex:1}
  .list-title{font-size:12.5px;font-weight:600;color:#c3cfe2}
  .list-body{display:flex;flex-direction:column;gap:9px}
  .item{border:1px solid var(--line);border-radius:13px;background:rgba(6,10,19,.42);overflow:hidden}
  .item[open]{border-color:var(--line-2);background:rgba(6,10,19,.6)}
  .item summary{display:flex;align-items:center;gap:10px;padding:10px 12px;cursor:pointer;list-style:none;user-select:none}
  .item summary::-webkit-details-marker{display:none}
  .item summary::before{content:'\f054';font:900 10px 'Font Awesome 6 Free';color:var(--dim);transition:transform .18s}
  .item[open] summary::before{transform:rotate(90deg)}
  .item-title{flex:1;font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .item-tools{display:flex;gap:5px}
  .item-body{padding:4px 14px 16px 14px;border-top:1px solid var(--line)}
  .item-body .fld:first-child{margin-top:14px}
  .empty{padding:18px;text-align:center;color:var(--dim);font-size:13px;border:1px dashed var(--line-2);border-radius:12px}

  /* ---------------------------------------------------------------- image field */
  .imgfield{display:flex;gap:13px;align-items:flex-start}
  .imgprev{
    width:118px;height:80px;flex:none;border-radius:11px;border:1px solid var(--line-2);overflow:hidden;
    background:rgba(6,10,19,.7) center/cover no-repeat;display:flex;align-items:center;justify-content:center;color:var(--dim);font-size:11px;text-align:center;
  }
  .imgbody{flex:1;min-width:0}
  .imgactions{display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap}
  .upstatus{font-size:11.5px;color:var(--muted)}

  /* ---------------------------------------------------------------- table */
  table{width:100%;border-collapse:collapse;font-size:13.5px}
  th{text-align:left;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);font-weight:700;padding:0 12px 10px}
  td{padding:12px;border-top:1px solid var(--line);vertical-align:middle}
  td.actions{text-align:right;white-space:nowrap}
  .role-tag{font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;letter-spacing:.05em}
  .role-tag.super{background:rgba(52,211,153,.14);color:#5eead4;border:1px solid rgba(52,211,153,.35)}
  .role-tag.editor{background:rgba(91,155,255,.13);color:#a9caff;border:1px solid rgba(91,155,255,.32)}

  /* ---------------------------------------------------------------- savebar */
  .savebar{
    position:fixed;left:264px;right:0;bottom:0;z-index:30;display:flex;align-items:center;gap:14px;
    padding:13px 32px;border-top:1px solid var(--line);background:rgba(8,12,22,.92);backdrop-filter:blur(14px);
  }
  .savebar .grow{flex:1}
  .status{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:8px}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--dim)}
  .status.dirty .dot{background:var(--amber);box-shadow:0 0 10px rgba(251,191,36,.7)}
  .status.saved .dot{background:var(--emerald);box-shadow:0 0 10px rgba(52,211,153,.7)}
  .status.busy .dot{background:var(--blue);animation:pulse 1s infinite}
  @keyframes pulse{50%{opacity:.25}}

  .banner{display:flex;gap:12px;align-items:flex-start;padding:13px 15px;border-radius:13px;font-size:13px;margin-bottom:18px;border:1px solid}
  .banner.warn{background:rgba(251,191,36,.09);border-color:rgba(251,191,36,.32);color:#fde4a8}
  .banner.err{background:rgba(251,113,133,.1);border-color:rgba(251,113,133,.36);color:#ffd0d8}
  .banner.ok{background:rgba(52,211,153,.09);border-color:rgba(52,211,153,.3);color:#b6f5dc}
  .banner .grow{flex:1}

  .toasts{position:fixed;bottom:82px;left:50%;transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:9px;align-items:center}
  .toast{
    padding:11px 17px;border-radius:12px;background:rgba(17,25,42,.97);border:1px solid var(--line-2);
    box-shadow:var(--shadow);font-size:13px;display:flex;align-items:center;gap:10px;animation:rise .22s ease-out;
  }
  @keyframes rise{from{opacity:0;transform:translateY(9px)}}
  .toast.ok i{color:var(--emerald)}
  .toast.err i{color:var(--rose)}

  .muted{color:var(--muted)}
  .dim{color:var(--dim)}
  .kv{display:grid;grid-template-columns:150px 1fr;gap:8px 16px;font-size:13.5px}
  .kv dt{color:var(--dim)}
  .kv dd{margin:0}
  .row{display:flex;gap:10px;flex-wrap:wrap}
  .split{display:grid;grid-template-columns:1fr 1fr;gap:14px}

  /* ---------------------------------------------------------------- analytics */
  .an-bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:18px}
  .an-ranges{display:inline-flex;gap:3px;padding:3px;border:1px solid var(--line);border-radius:12px;background:rgba(6,10,19,.6)}
  .an-range{padding:7px 13px;border:0;border-radius:9px;background:transparent;color:var(--muted);font-size:12.5px;font-weight:600;cursor:pointer;transition:background .15s,color .15s;white-space:nowrap}
  .an-range:hover{color:var(--text)}
  .an-range.on{background:rgba(91,155,255,.18);color:#cfe2ff}
  .an-live{display:inline-flex;align-items:center;gap:9px;padding:8px 14px;border:1px solid var(--line);border-radius:999px;background:rgba(6,10,19,.5);font-size:12.5px;color:var(--muted)}
  .an-live .beat{width:8px;height:8px;border-radius:50%;background:var(--emerald);box-shadow:0 0 0 0 rgba(52,211,153,.6);animation:beat 2s infinite}
  .an-live.idle .beat{background:var(--dim);animation:none;box-shadow:none}
  @keyframes beat{70%{box-shadow:0 0 0 9px rgba(52,211,153,0)}100%{box-shadow:0 0 0 0 rgba(52,211,153,0)}}
  .an-kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(166px,1fr));gap:12px;margin-bottom:18px}
  .an-kpi{background:linear-gradient(180deg,rgba(20,29,47,.7),rgba(13,19,33,.7));border:1px solid var(--line);border-radius:14px;padding:15px 16px}
  .an-kpi .k{font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--dim);font-weight:700;display:flex;align-items:center;gap:7px}
  .an-kpi .v{font-size:25px;font-weight:700;letter-spacing:-.02em;margin-top:7px;line-height:1.15}
  .an-kpi .s{font-size:11.5px;color:var(--muted);margin-top:4px}
  .an-kpi .s b{color:#a9caff;font-weight:600}
  .an-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start}
  .an-grid.three{grid-template-columns:repeat(3,1fr)}
  .an-card{background:linear-gradient(180deg,rgba(20,29,47,.7),rgba(13,19,33,.7));border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:18px}
  .an-card h4{margin:0 0 2px;font-size:14px;display:flex;align-items:center;gap:8px}
  .an-card h4 i{color:var(--blue);font-size:12.5px}
  .an-card .sub{font-size:12px;color:var(--dim);margin-bottom:14px}
  .an-chart{position:relative;width:100%}
  .an-chart svg{display:block;width:100%;height:auto;overflow:visible}
  .an-tip{position:absolute;pointer-events:none;opacity:0;transform:translate(-50%,0);transition:opacity .12s;background:rgba(9,14,25,.97);border:1px solid var(--line-2);border-radius:10px;padding:8px 11px;font-size:12px;white-space:nowrap;box-shadow:var(--shadow);z-index:5}
  .an-legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:10px}
  .an-legend span{display:inline-flex;align-items:center;gap:7px}
  .an-legend i{width:9px;height:9px;border-radius:3px;display:inline-block}
  .an-list{display:flex;flex-direction:column;gap:10px}
  .an-line{display:grid;grid-template-columns:1fr auto;gap:5px 10px;align-items:center;font-size:12.5px}
  .an-line .lb{color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .an-line .nm{color:var(--muted);font-variant-numeric:tabular-nums;font-size:12px}
  .an-track{grid-column:1/-1;height:6px;border-radius:999px;background:rgba(255,255,255,.06);overflow:hidden;display:block}
  .an-fill{height:100%;border-radius:999px;background:linear-gradient(90deg,rgba(91,155,255,.85),rgba(52,211,153,.8));display:block}
  .an-empty{font-size:12.5px;color:var(--dim);padding:8px 0}
  .an-donut{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
  .an-donut .ring{flex:none}
  .an-scroll{display:flex;flex-direction:column;gap:9px}
  .an-scroll .st{display:grid;grid-template-columns:46px 1fr 42px;gap:10px;align-items:center;font-size:12.5px}
  .an-scroll .st .lb{color:var(--muted)}
  .an-scroll .st .nm{color:var(--muted);text-align:right;font-variant-numeric:tabular-nums;font-size:12px}
  .an-scroll .an-track{grid-column:auto}
  .an-sub{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);font-weight:700;margin:16px 0 9px}
  .an-sub:first-child{margin-top:0}
  .an-notes{font-size:12.5px;color:var(--muted);line-height:1.7;margin:0;padding-left:18px}
  .an-notes li{margin-bottom:7px}
  .an-notes code{background:rgba(255,255,255,.06);padding:1px 6px;border-radius:5px;font-size:11.5px}
  .an-skel{height:260px;border-radius:14px;background:linear-gradient(90deg,rgba(255,255,255,.04),rgba(255,255,255,.09),rgba(255,255,255,.04));background-size:200% 100%;animation:shimmer 1.3s infinite}
  @keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}

  @media(max-width:900px){
    #app{grid-template-columns:1fr}
    .sidebar{position:static;max-height:none;border-right:0;border-bottom:1px solid var(--line);padding-bottom:14px}
    .savebar{left:0;padding:11px 16px}
    .main{padding:20px 16px 150px}
    .split{grid-template-columns:1fr}
    .an-grid,.an-grid.three{grid-template-columns:1fr}
    .an-kpis{grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}
  }
</style>
</head>
<body>

<!-- ============================== LOGIN ============================== -->
<div id="login">
  <div class="login-card">
    <div class="brand">
      <div class="brand-mark">RW</div>
      <div>
        <div class="brand-name">Content Studio</div>
        <div class="brand-sub">Dr. Rick Wolthusen</div>
      </div>
    </div>
    <h1>Sign in</h1>
    <p class="sub">Edit the public site, change photos, and manage who has access.</p>
    <div id="loginError" class="banner err hidden"><i class="fa-solid fa-circle-exclamation"></i><div class="grow" id="loginErrorText"></div></div>
    <form id="loginForm" autocomplete="on">
      <div class="fld">
        <label class="fld-label" for="lgUser">Username</label>
        <input class="inp" id="lgUser" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required>
      </div>
      <div class="fld">
        <label class="fld-label" for="lgPass">Password</label>
        <input class="inp" id="lgPass" name="password" type="password" autocomplete="current-password" required>
      </div>
      <button class="btn btn-primary btn-block" type="submit" id="lgSubmit"><i class="fa-solid fa-arrow-right-to-bracket"></i> Sign in</button>
    </form>
    <div class="login-foot">Authorised access only · <a href="/">back to the site</a></div>
  </div>
</div>

<!-- =============================== APP =============================== -->
<div id="app" class="hidden">
  <header class="topbar">
    <div class="brand" style="margin:0">
      <div class="brand-mark" style="width:36px;height:36px;border-radius:11px;font-size:15px">RW</div>
      <div>
        <div class="brand-name" style="font-size:14.5px">Content Studio</div>
        <div class="brand-sub" style="font-size:11px">rick-phi-azure.vercel.app</div>
      </div>
    </div>
    <div class="grow"></div>
    <a class="btn btn-sm btn-ghost" href="/" target="_blank" rel="noopener"><i class="fa-solid fa-arrow-up-right-from-square"></i> View site</a>
    <div class="who">
      <div class="avatar" id="whoAvatar">A</div>
      <div>
        <div class="who-name" id="whoName">Admin</div>
        <div class="who-role" id="whoRole">super admin</div>
      </div>
    </div>
  </header>

  <nav class="sidebar" id="sidebar"></nav>
  <main class="main" id="main"></main>

  <div class="savebar" id="savebar">
    <div class="status" id="saveStatus"><span class="dot"></span><span id="saveStatusText">All changes saved</span></div>
    <div class="grow"></div>
    <button class="btn btn-sm btn-ghost hidden" id="reloadBtn"><i class="fa-solid fa-rotate"></i> Reload latest</button>
    <button class="btn btn-sm btn-ghost" id="discardBtn"><i class="fa-solid fa-rotate-left"></i> Discard changes</button>
    <button class="btn btn-primary" id="saveBtn"><i class="fa-solid fa-cloud-arrow-up"></i> Save &amp; publish</button>
  </div>
</div>

  /* =============================== renderers =============================== */

  function fieldShell(label, hint) {
    var row = document.createElement('div');
    row.className = 'fld';
    if (label) {
      var lab = document.createElement('label');
      lab.className = 'fld-label';
      lab.textContent = label;
      row.appendChild(lab);
    }
    return row;
  }

  function addHint(row, hint) {
    if (!hint) return;
    var node = document.createElement('div');
    node.className = 'hint';
    node.textContent = hint;
    row.appendChild(node);
  }

  function makeField(field, obj, onChange) {
    if (field.type === 'group') {
      var group = getIn(obj, field.path);
      if (group == null || typeof group !== 'object') { setIn(obj, field.path, {}); group = getIn(obj, field.path); }
      var box = document.createElement('div');
      box.className = 'card';
      box.innerHTML = '<h3>' + esc(field.label) + '</h3>';
      (field.fields || []).forEach(function (sub) { box.appendChild(makeField(sub, group, onChange)); });
      var outer = document.createElement('div');
      outer.className = 'fld';
      outer.appendChild(box);
      return outer;
    }

    if (field.type === 'list') return makeList(field, obj, onChange);
    if (field.type === 'stringlist') return makeStringList(field, obj, onChange);
    if (field.type === 'image') return makeImageField(field, obj, onChange);

    var row = fieldShell(field.label, null);
    var id = uid();
    var input;
    var value = getIn(obj, field.path);

    if (field.type === 'textarea' || field.type === 'html') {
      input = document.createElement('textarea');
      input.className = 'inp' + (field.type === 'html' ? ' mono' : '');
      input.rows = field.type === 'html' ? 3 : 3;
      input.value = value == null ? '' : String(value);
    } else if (field.type === 'select') {
      input = document.createElement('select');
      input.className = 'inp';
      (field.options || []).forEach(function (pair) {
        var opt = document.createElement('option');
        opt.value = pair[0];
        opt.textContent = pair[1];
        input.appendChild(opt);
      });
      input.value = value == null ? '' : String(value);
    } else if (field.type === 'checkbox') {
      input = document.createElement('input');
      input.type = 'checkbox';
      input.checked = !!value;
    } else if (field.type === 'number') {
      input = document.createElement('input');
      input.className = 'inp';
      input.type = 'number';
      input.min = '0';
      input.step = '1';
      input.value = value == null ? '' : String(value);
    } else {
      input = document.createElement('input');
      input.className = 'inp';
      input.type = 'text';
      input.value = value == null ? '' : String(value);
      input.spellcheck = field.type !== 'text' ? false : true;
    }
    input.id = id;
    row.querySelector('label').setAttribute('for', id);

    if (field.type === 'icon') {
      input.setAttribute('list', 'iconList');
      row.appendChild(input);
    } else if (field.type === 'checkbox') {
      var wrap = document.createElement('label');
      wrap.className = 'fld-inline';
      wrap.style.cursor = 'pointer';
      wrap.appendChild(input);
      var txt = document.createElement('span');
      txt.className = 'muted';
      txt.textContent = field.label;
      row.querySelector('.fld-label').remove();
      wrap.appendChild(txt);
      row.appendChild(wrap);
    } else {
      row.appendChild(input);
    }

    function commit() {
      var next;
      if (field.type === 'checkbox') next = input.checked;
      else if (field.type === 'number') next = input.value === '' ? 0 : Number(input.value);
      else next = input.value;
      setIn(obj, field.path, next);
      markDirty();
      if (onChange) onChange(next);
    }
    input.addEventListener('input', commit);
    input.addEventListener('change', commit);
    addHint(row, field.hint);
    return row;
  }

  function defaultItem(field) {
    var item = {};
    (field.fields || []).forEach(function (sub) {
      if (sub.type === 'number') item[sub.path] = 0;
      else if (sub.type === 'checkbox') item[sub.path] = false;
      else if (sub.type === 'select') item[sub.path] = (sub.options && sub.options[0] && sub.options[0][0]) || '';
      else if (sub.type === 'group') item[sub.path] = {};
      else item[sub.path] = '';
    });
    return item;
  }

  function itemTitle(field, item, index) {
    var value = field.titleField ? item && item[field.titleField] : null;
    if (typeof value === 'string' && value.trim()) {
      return value.length > 68 ? value.slice(0, 68) + '…' : value;
    }
    return field.item + ' ' + (index + 1);
  }

  function iconButton(icon, label, handler, extraClass) {
    var button = document.createElement('button');
    button.type = 'button';
    button.className = 'iconbtn' + (extraClass ? ' ' + extraClass : '');
    button.title = label;
    button.setAttribute('aria-label', label);
    button.innerHTML = '<i class="fa-solid ' + icon + '"></i>';
    button.addEventListener('click', function (event) {
      event.preventDefault();
      event.stopPropagation();
      handler();
    });
    return button;
  }

  function makeList(field, obj, onChange) {
    var wrap = document.createElement('div');
    wrap.className = 'fld';
    var head = document.createElement('div');
    head.className = 'list-head';
    var titleBox = document.createElement('div');
    titleBox.innerHTML = '<div class="list-title">' + esc(field.label) + '</div>' + (field.hint ? '<div class="hint">' + esc(field.hint) + '</div>' : '');
    head.appendChild(titleBox);
    var add = document.createElement('button');
    add.type = 'button';
    add.className = 'btn btn-sm';
    add.innerHTML = '<i class="fa-solid fa-plus"></i> Add ' + esc((field.item || 'item').toLowerCase());
    head.appendChild(add);
    wrap.appendChild(head);

    var body = document.createElement('div');
    body.className = 'list-body';
    wrap.appendChild(body);

    function rebuild() {
      body.innerHTML = '';
      var items = getIn(obj, field.path);
      if (!Array.isArray(items)) { items = []; setIn(obj, field.path, items); }
      if (!items.length) {
        var empty = document.createElement('div');
        empty.className = 'empty';
        empty.textContent = 'Nothing yet — use the button above to add one.';
        body.appendChild(empty);
        return;
      }
      items.forEach(function (item, index) { body.appendChild(makeItem(field, items, index, rebuild, onChange)); });
    }

    add.addEventListener('click', function () {
      var items = getIn(obj, field.path);
      items.push(defaultItem(field));
      rebuild();
      markDirty();
      var last = body.lastElementChild;
      if (last) { last.open = true; last.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); }
      if (onChange) onChange();
    });

    rebuild();
    return wrap;
  }

  function makeItem(field, items, index, rebuild, onChange) {
    var item = items[index];
    var details = document.createElement('details');
    details.className = 'item';
    if (index === 0) details.open = true;

    var summary = document.createElement('summary');
    var title = document.createElement('span');
    title.className = 'item-title';
    title.textContent = itemTitle(field, item, index);
    summary.appendChild(title);

    var tools = document.createElement('span');
    tools.className = 'item-tools';
    tools.appendChild(iconButton('fa-arrow-up', 'Move up', function () {
      if (index === 0) return;
      items.splice(index - 1, 0, items.splice(index, 1)[0]);
      rebuild(); markDirty(); if (onChange) onChange();
    }));
    tools.appendChild(iconButton('fa-arrow-down', 'Move down', function () {
      if (index === items.length - 1) return;
      items.splice(index + 1, 0, items.splice(index, 1)[0]);
      rebuild(); markDirty(); if (onChange) onChange();
    }));
    tools.appendChild(iconButton('fa-copy', 'Duplicate', function () {
      items.splice(index + 1, 0, clone(item));
      rebuild(); markDirty(); if (onChange) onChange();
    }));
    tools.appendChild(iconButton('fa-trash', 'Remove', function () {
      items.splice(index, 1);
      rebuild(); markDirty(); if (onChange) onChange();
    }, 'danger'));
    summary.appendChild(tools);
    details.appendChild(summary);

    var body = document.createElement('div');
    body.className = 'item-body';
    var refreshTitle = function () { title.textContent = itemTitle(field, item, index); };
    (field.fields || []).forEach(function (sub) {
      body.appendChild(makeField(sub, item, function () { refreshTitle(); if (onChange) onChange(); }));
    });
    details.appendChild(body);
    return details;
  }

  function makeStringList(field, obj, onChange) {
    var wrap = document.createElement('div');
    wrap.className = 'fld';
    var head = document.createElement('div');
    head.className = 'list-head';
    head.innerHTML = '<div><div class="list-title">' + esc(field.label) + '</div>' + (field.hint ? '<div class="hint">' + esc(field.hint) + '</div>' : '') + '</div>';
    var add = document.createElement('button');
    add.type = 'button';
    add.className = 'btn btn-sm';
    add.innerHTML = '<i class="fa-solid fa-plus"></i> Add ' + esc((field.item || 'item').toLowerCase());
    head.appendChild(add);
    wrap.appendChild(head);

    var body = document.createElement('div');
    body.className = 'list-body';
    wrap.appendChild(body);

    function rebuild() {
      body.innerHTML = '';
      var items = getIn(obj, field.path);
      if (!Array.isArray(items)) { items = []; setIn(obj, field.path, items); }
      items.forEach(function (value, index) {
        var row = document.createElement('div');
        row.className = 'fld-inline';
        var input = document.createElement('textarea');
        input.className = 'inp' + (field.html ? ' mono' : '');
        input.rows = field.html ? 3 : 2;
        input.value = value == null ? '' : String(value);
        input.addEventListener('input', function () {
          items[index] = input.value;
          markDirty();
          if (onChange) onChange();
        });
        var tools = document.createElement('span');
        tools.className = 'item-tools';
        tools.style.flexDirection = 'column';
        tools.appendChild(iconButton('fa-arrow-up', 'Move up', function () {
          if (index === 0) return;
          items.splice(index - 1, 0, items.splice(index, 1)[0]);
          rebuild(); markDirty();
        }));
        tools.appendChild(iconButton('fa-arrow-down', 'Move down', function () {
          if (index === items.length - 1) return;
          items.splice(index + 1, 0, items.splice(index, 1)[0]);
          rebuild(); markDirty();
        }));
        tools.appendChild(iconButton('fa-trash', 'Remove', function () {
          items.splice(index, 1);
          rebuild(); markDirty();
        }, 'danger'));
        row.appendChild(input);
        row.appendChild(tools);
        body.appendChild(row);
      });
      if (!items.length) {
        body.innerHTML = '<div class="empty">Nothing yet — use the button above to add one.</div>';
      }
    }

    add.addEventListener('click', function () {
      var items = getIn(obj, field.path);
      items.push('');
      rebuild(); markDirty();
      var inputs = body.querySelectorAll('textarea');
      if (inputs.length) inputs[inputs.length - 1].focus();
    });

    rebuild();
    return wrap;
  }

  function makeImageField(field, obj, onChange) {
    var row = fieldShell(field.label, null);
    var value = getIn(obj, field.path) || '';

    var box = document.createElement('div');
    box.className = 'imgfield';
    var preview = document.createElement('div');
    preview.className = 'imgprev';
    var body = document.createElement('div');
    body.className = 'imgbody';

    var input = document.createElement('input');
    input.className = 'inp';
    input.type = 'text';
    input.placeholder = 'images/… or upload a new file';
    input.value = String(value);
    input.spellcheck = false;

    var actions = document.createElement('div');
    actions.className = 'imgactions';
    var fileInput = document.createElement('input');
    fileInput.type = 'file';
    fileInput.accept = 'image/*';
    fileInput.className = 'hidden';
    var upload = document.createElement('button');
    upload.type = 'button';
    upload.className = 'btn btn-sm';
    upload.innerHTML = '<i class="fa-solid fa-arrow-up-from-bracket"></i> Upload image';
    var status = document.createElement('span');
    status.className = 'upstatus';
    actions.appendChild(upload);
    actions.appendChild(fileInput);
    actions.appendChild(status);

    body.appendChild(input);
    body.appendChild(actions);
    box.appendChild(preview);
    box.appendChild(body);
    row.appendChild(box);

    function paint() {
      var url = mediaUrl(getIn(obj, field.path));
      if (url) {
        preview.style.backgroundImage = 'url("' + url.replace(/"/g, '%22') + '")';
        preview.textContent = '';
      } else {
        preview.style.backgroundImage = '';
        preview.textContent = 'No image';
      }
    }

    input.addEventListener('input', function () {
      setIn(obj, field.path, input.value.trim());
      paint(); markDirty(); if (onChange) onChange();
    });

    upload.addEventListener('click', function () { fileInput.click(); });

    fileInput.addEventListener('change', async function () {
      var file = fileInput.files && fileInput.files[0];
      fileInput.value = '';
      if (!file) return;
      status.textContent = 'Preparing…';
      upload.disabled = true;
      try {
        var prepared = await shrink(file);
        status.textContent = 'Uploading ' + Math.round(prepared.size / 1024) + ' KB…';
        // Sent as octet-stream: the serverless runtime drops some image content types.
        var res = await fetch('/api/upload?name=' + encodeURIComponent(prepared.name) + '&type=' + encodeURIComponent(prepared.type || 'image/jpeg'), {
          method: 'POST',
          credentials: 'same-origin',
          headers: { 'Content-Type': 'application/octet-stream' },
          body: prepared
        });
        var data = await res.json().catch(function () { return null; });
        if (!res.ok || !data || data.ok === false) throw new Error((data && data.error) || 'Upload failed');
        setIn(obj, field.path, data.path);
        input.value = data.path;
        paint(); markDirty(); if (onChange) onChange();
        status.textContent = 'Uploaded';
        toast('Image uploaded');
      } catch (error) {
        status.textContent = '';
        toast(error.message || 'Upload failed', 'err');
      } finally {
        upload.disabled = false;
        setTimeout(function () { status.textContent = ''; }, 4000);
      }
    });

    paint();
    addHint(row, field.hint);
    return row;
  }

  /** Keep uploads under the server limit without visible quality loss. */
  async function shrink(file) {
    var MAX = 2000;
    var LIMIT = 1.5 * 1024 * 1024;
    if (!/^image\//.test(file.type) || file.type === 'image/gif') return file;
    var isPng = file.type === 'image/png';
    if (file.size <= LIMIT && !isPng) return file;
    var bitmap;
    try { bitmap = await createImageBitmap(file); } catch (_) { return file; }
    var scale = Math.min(1, MAX / Math.max(bitmap.width, bitmap.height));
    var canvas = document.createElement('canvas');
    canvas.width = Math.max(1, Math.round(bitmap.width * scale));
    canvas.height = Math.max(1, Math.round(bitmap.height * scale));
    canvas.getContext('2d').drawImage(bitmap, 0, 0, canvas.width, canvas.height);
    if (bitmap.close) bitmap.close();
    if (isPng && scale === 1) return file;
    var blob = await new Promise(function (resolve) { canvas.toBlob(resolve, 'image/jpeg', 0.86); });
    if (!blob || blob.size >= file.size) return file;
    var name = file.name.replace(/\.[^.]+$/, '') + '.jpg';
    return new File([blob], name, { type: 'image/jpeg' });
  }

  /* =============================== status / save =============================== */

  function isDirty() {
    if (!state.content || !state.base) return false;
    return JSON.stringify(state.content) !== JSON.stringify(state.base);
  }

  var statusTimer = null;
  function markDirty() {
    clearTimeout(statusTimer);
    statusTimer = setTimeout(paintStatus, 120);
  }

  function paintStatus(mode, text) {
    var box = $('#saveStatus');
    var label = $('#saveStatusText');
    box.className = 'status';
    if (mode === 'busy') { box.classList.add('busy'); label.textContent = text || 'Saving…'; }
    else if (mode === 'saved') { box.classList.add('saved'); label.textContent = text || 'Saved — live on the site'; }
    else if (mode === 'error') { label.textContent = text || 'Could not save'; }
    else if (isDirty()) { box.classList.add('dirty'); label.textContent = 'Unsaved changes'; }
    else { box.classList.add('saved'); label.textContent = 'All changes saved'; }
    $('#saveBtn').disabled = mode === 'busy' || !isDirty();
    $('#discardBtn').disabled = !isDirty();
  }

  async function save() {
    if (state.saving || !isDirty()) return;
    state.saving = true;
    paintStatus('busy');
    try {
      var data = await api('/api/save', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ content: state.content, sha: state.sha })
      });
      state.sha = data.sha || state.sha;
      state.base = clone(state.content);
      paintStatus('saved');
      toast('Saved — the live site updates immediately');
    } catch (error) {
      paintStatus('error', error.message);
      if (error.status === 409) {
        showConflict(error.message);
      } else {
        toast(error.message, 'err');
      }
    } finally {
      state.saving = false;
      setTimeout(function () { if (!state.saving) paintStatus(); }, 2600);
    }
  }

  function showConflict(message) {
    clearConflict();
    var banner = h('<div class="banner warn" id="conflict"><i class="fa-solid fa-triangle-exclamation"></i><div class="grow">' +
      esc(message) + ' Your edits are still here — reload to work from the newest copy, then reapply them.</div>' +
      '<button class="btn btn-sm" id="conflictReload"><i class="fa-solid fa-rotate"></i> Reload latest</button></div>');
    state.conflictNode = banner;
    $('#main').prepend(banner);
    $('#conflictReload').addEventListener('click', function () {
      loadContent().then(function () {
        clearConflict();
        renderNav();
        renderPanel();
        toast('Working from the newest copy');
      });
    });
  }

  function clearConflict() {
    if (state.conflictNode) state.conflictNode.remove();
    state.conflictNode = null;
  }

  };

  var anState = { days: 30, data: null, loading: false, timer: null, at: 0 };

  function anNum(value) { return (Number(value) || 0).toLocaleString('en-US'); }

  function anDuration(seconds) {
    var s = Math.max(0, Math.round(Number(seconds) || 0));
    if (s < 60) return s + 's';
    var m = Math.floor(s / 60);
    if (m < 60) return m + 'm' + (s % 60 ? ' ' + (s % 60) + 's' : '');
    return Math.floor(m / 60) + 'h ' + (m % 60) + 'm';
  }

  function anPlural(count, single, plural) {
    return anNum(count) + ' ' + (Number(count) === 1 ? single : plural);
  }

  function anShare(part, whole) {
    if (!whole) return '0%';
    return (Math.round(((Number(part) || 0) / whole) * 1000) / 10) + '%';
  }

  function anShortDate(key) {
    var parts = String(key || '').split('-');
    if (parts.length !== 3) return String(key || '');
    var d = new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]));
    return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
  }

  function anCountry(code) {
    var c = String(code || '').toUpperCase();
    if (!c || c === 'XX' || c === 'T1') return 'Unknown';
    try {
      if (typeof Intl !== 'undefined' && Intl.DisplayNames) {
        var name = new Intl.DisplayNames(['en'], { type: 'region' }).of(c);
        if (name && name !== c) return name;
      }
    } catch (_) { /* fall back to the code */ }
    return c;
  }

  function anLanguage(code) {
    var c = String(code || '').toLowerCase();
    if (!c) return 'Unknown';
    var base = c.split('-')[0];
    try {
      if (typeof Intl !== 'undefined' && Intl.DisplayNames) {
        var name = new Intl.DisplayNames(['en'], { type: 'language' }).of(base);
        if (name && name !== base) return name.charAt(0).toUpperCase() + name.slice(1);
      }
    } catch (_) { /* fall back to the code */ }
    return base;
  }

  function anPodLabel(key) {
    return key === '/' ? 'Home' : String(key || '').replace(/^#/, '');
  }

  /** Round the axis up to a whole number of readable steps (4 gridlines). */
  function anNiceScale(maxValue) {
    var v = Math.max(1, Number(maxValue) || 1);
    var raw = v / 4;
    var mag = Math.pow(10, Math.floor(Math.log10(raw)));
    var norm = raw / mag;
    var step = (norm <= 1 ? 1 : norm <= 2 ? 2 : norm <= 2.5 ? 2.5 : norm <= 5 ? 5 : 10) * mag;
    return { max: step * 4, step: step };
  }

  function anTick(value) {
    var n = Math.round((Number(value) || 0) * 10) / 10;
    return n % 1 === 0 ? anNum(n) : n.toFixed(1);
  }

  /** Area + line chart with a hover readout. Geometry is returned so the tooltip stays in step. */
  function anChartGeometry(labels, series) {
    var W = 720, H = 250, L = 46, R = 14, T = 16, B = 30;
    var iw = W - L - R, ih = H - T - B;
    var peak = 0;
    series.forEach(function (s) { s.values.forEach(function (v) { if (v > peak) peak = v; }); });
    var scale = anNiceScale(peak);
    var max = scale.max;
    var X = function (i) { return labels.length <= 1 ? L + iw / 2 : L + (i / (labels.length - 1)) * iw; };
    var Y = function (v) { return T + ih - (max ? (v / max) * ih : 0); };

    var svg = '';
    for (var g = 0; g <= 4; g += 1) {
      var y = T + (ih * g) / 4;
      svg += '<line x1="' + L + '" y1="' + y.toFixed(1) + '" x2="' + (W - R) + '" y2="' + y.toFixed(1) + '" stroke="rgba(255,255,255,.07)" stroke-width="1"/>' +
        '<text x="' + (L - 9) + '" y="' + (y + 4).toFixed(1) + '" text-anchor="end" fill="#66748c" font-size="10.5">' + anTick(max - scale.step * g) + '</text>';
    }

    var every = Math.max(1, Math.ceil(labels.length / 8));
    labels.forEach(function (label, i) {
      if (i % every !== 0 && i !== labels.length - 1) return;
      svg += '<text x="' + X(i).toFixed(1) + '" y="' + (H - 9) + '" text-anchor="middle" fill="#66748c" font-size="10.5">' + esc(label) + '</text>';
    });

    var guides = '';
    series.forEach(function (s, si) {
      var path = '';
      s.values.forEach(function (v, i) { path += (i ? ' L' : 'M') + X(i).toFixed(1) + ' ' + Y(v).toFixed(1); });
      if (si === 0 && s.values.length > 1) {
        var base = (T + ih).toFixed(1);
        var area = path + ' L' + X(s.values.length - 1).toFixed(1) + ' ' + base + ' L' + X(0).toFixed(1) + ' ' + base + ' Z';
        svg += '<defs><linearGradient id="anFill' + si + '" x1="0" y1="0" x2="0" y2="1">' +
          '<stop offset="0%" stop-color="' + s.color + '" stop-opacity=".32"/><stop offset="100%" stop-color="' + s.color + '" stop-opacity="0"/></linearGradient></defs>' +
          '<path d="' + area + '" fill="url(#anFill' + si + ')"/>';
      }
      svg += '<path d="' + path + '" fill="none" stroke="' + s.color + '" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>';
      guides += '<circle cx="' + X(0) + '" cy="' + Y(0) + '" r="0" fill="' + s.color + '"/>';
    });

    var hits = '';
    var slot = labels.length > 1 ? iw / (labels.length - 1) : iw;
    labels.forEach(function (_, i) {
      hits += '<rect x="' + (X(i) - slot / 2).toFixed(1) + '" y="' + T + '" width="' + slot.toFixed(1) + '" height="' + ih + '" fill="transparent"/>';
    });

    return { W: W, H: H, T: T, ih: ih, X: X, Y: Y, hits: hits, svg: svg };
  }

  function anChart(box, labels, series) {
    var geo = anChartGeometry(labels, series);
    box.innerHTML = '<svg viewBox="0 0 ' + geo.W + ' ' + geo.H + '" role="img" aria-label="Traffic over time">' +
      geo.svg + '<g class="an-hits">' + geo.hits + '</g></svg><div class="an-tip"></div>';
    if (labels.length < 2) return;

    var svg = box.querySelector('svg');
    var tip = box.querySelector('.an-tip');
    var guide = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    guide.setAttribute('stroke', 'rgba(255,255,255,.28)');
    guide.setAttribute('stroke-width', '1');
    guide.setAttribute('stroke-dasharray', '3 3');
    guide.setAttribute('opacity', '0');
    svg.appendChild(guide);

    function at(event) {
      var rect = svg.getBoundingClientRect();
      var px = ((event.clientX - rect.left) / rect.width) * geo.W;
      var best = 0, dist = Infinity;
      for (var i = 0; i < labels.length; i += 1) {
        var d = Math.abs(geo.X(i) - px);
        if (d < dist) { dist = d; best = i; }
      }
      return { i: best, rect: rect };
    }

    svg.addEventListener('mousemove', function (event) {
      var hit = at(event);
      var rows = '<strong>' + esc(labels[hit.i]) + '</strong>';
      series.forEach(function (s) {
        rows += '<div style="display:flex;gap:10px;align-items:center;margin-top:4px">' +
          '<i style="width:8px;height:8px;border-radius:2px;background:' + s.color + ';display:inline-block"></i>' +
          '<span>' + esc(s.name) + '</span><b style="margin-left:auto;padding-left:14px">' + anNum(s.values[hit.i]) + '</b></div>';
      });
      tip.innerHTML = rows;
      tip.style.opacity = '1';
      tip.style.top = '2px';
      tip.style.left = Math.min(Math.max((geo.X(hit.i) / geo.W) * hit.rect.width, 70), Math.max(70, hit.rect.width - 70)) + 'px';
      guide.setAttribute('x1', geo.X(hit.i)); guide.setAttribute('x2', geo.X(hit.i));
      guide.setAttribute('y1', geo.T); guide.setAttribute('y2', geo.T + geo.ih);
      guide.setAttribute('opacity', '1');
    });

    svg.addEventListener('mouseleave', function () {
      tip.style.opacity = '0';
      guide.setAttribute('opacity', '0');
    });
  }

  function anLegend(series) {
    return '<div class="an-legend">' + series.map(function (s) {
      return '<span><i style="background:' + s.color + '"></i>' + esc(s.name) + '</span>';
    }).join('') + '</div>';
  }

  function anList(entries, opts) {
    opts = opts || {};
    if (!entries || !entries.length) return '<div class="an-empty">' + esc(opts.empty || 'Nothing recorded yet.') + '</div>';
    var max = entries.reduce(function (a, e) { return Math.max(a, e.value); }, 0);
    return '<div class="an-list">' + entries.map(function (e, i) {
      var label = opts.format ? opts.format(e.label) : e.label;
      var pct = max ? Math.max(3, (e.value / max) * 100) : 0;
      var color = opts.mono === false
        ? 'background:' + AN_COLORS[i % AN_COLORS.length]
        : 'background:linear-gradient(90deg,rgba(91,155,255,.85),rgba(52,211,153,.8))';
      return '<div class="an-line">' +
        '<span class="lb" title="' + esc(label) + '">' + esc(label) + '</span>' +
        '<span class="nm">' + anNum(e.value) + esc(opts.suffix || '') + '</span>' +
        '<span class="an-track"><span class="an-fill" style="width:' + pct.toFixed(1) + '%;' + color + '"></span></span></div>';
    }).join('') + '</div>';
  }

  function anDonut(entries) {
    if (!entries || !entries.length) return '<div class="an-empty">Nothing recorded yet.</div>';
    var total = entries.reduce(function (a, e) { return a + e.value; }, 0) || 1;
    var R = 46, C = 2 * Math.PI * R, offset = 0;
    var segs = entries.map(function (e, i) {
      var frac = e.value / total;
      var seg = '<circle cx="60" cy="60" r="' + R + '" fill="none" stroke="' + AN_COLORS[i % AN_COLORS.length] + '" stroke-width="16" ' +
        'stroke-dasharray="' + (frac * C).toFixed(2) + ' ' + C.toFixed(2) + '" stroke-dashoffset="' + (-offset).toFixed(2) + '" transform="rotate(-90 60 60)"/>';
      offset += frac * C;
      return seg;
    }).join('');
    var legend = '<div class="an-list" style="flex:1;min-width:170px">' + entries.map(function (e, i) {
      return '<div class="an-line" style="grid-template-columns:auto 1fr auto">' +
        '<i style="width:9px;height:9px;border-radius:3px;background:' + AN_COLORS[i % AN_COLORS.length] + ';display:inline-block"></i>' +
        '<span class="lb">' + esc(e.label) + '</span>' +
        '<span class="nm">' + anShare(e.value, total) + ' · ' + anNum(e.value) + '</span></div>';
    }).join('') + '</div>';
    return '<div class="an-donut"><svg class="ring" width="120" height="120" viewBox="0 0 120 120">' +
      '<circle cx="60" cy="60" r="46" fill="none" stroke="rgba(255,255,255,.06)" stroke-width="16"/>' + segs +
      '<text x="60" y="59" text-anchor="middle" fill="#e8edf7" font-size="20" font-weight="700">' + anNum(total) + '</text>' +
      '<text x="60" y="75" text-anchor="middle" fill="#66748c" font-size="10.5">sessions</text></svg>' + legend + '</div>';
  }

  function anScrollFunnel(scroll, sessions) {
    var rows = [25, 50, 75, 100].map(function (depth) {
      var value = (scroll && scroll[depth]) || 0;
      var pct = sessions ? Math.min(100, Math.round((value / sessions) * 100)) : 0;
      return '<div class="st"><span class="lb">' + depth + '%</span>' +
        '<span class="an-track"><span class="an-fill" style="width:' + pct + '%"></span></span>' +
        '<span class="nm">' + pct + '%</span></div>';
    });
    return '<div class="an-scroll">' + rows.join('') + '</div>' +
      '<div class="sub" style="margin:12px 0 0;font-size:11.5px">Share of sessions that scrolled at least this far down a page.</div>';
  }

  function anHourly(hourly) {
    var max = Math.max.apply(null, hourly.concat([1]));
    var bars = hourly.map(function (value, hour) {
      var pct = Math.round((value / max) * 100);
      var bg = value ? 'linear-gradient(180deg,rgba(91,155,255,.95),rgba(91,155,255,.4))' : 'rgba(255,255,255,.06)';
      return '<div title="' + (hour < 10 ? '0' : '') + hour + ':00 UTC · ' + anNum(value) + '" ' +
        'style="flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:100%">' +
        '<div style="height:' + Math.max(value ? 5 : 1, pct) + '%;border-radius:3px 3px 0 0;background:' + bg + '"></div></div>';
    }).join('');
    return '<div style="display:flex;gap:3px;align-items:flex-end;height:78px;margin-top:4px">' + bars + '</div>' +
      '<div style="display:flex;justify-content:space-between;font-size:10.5px;color:var(--dim);margin-top:6px">' +
      '<span>00:00</span><span>06:00</span><span>12:00</span><span>18:00</span><span>23:00</span></div>';
  }

  function anNotes() {
    return '<div class="an-card"><h4><i class="fa-solid fa-shield-halved"></i> How this is measured</h4>' +
      '<div class="sub">What is collected, what is deliberately not, and how to read the figures.</div>' +
      '<ul class="an-notes">' +
      '<li><strong>Cookieless.</strong> Nothing is stored on a visitor\'s device, so there is no consent banner to manage. A visitor is recognised for the day by a one-way hash that cannot be reversed and is re-keyed every month, which is enough to count repeat visits without identifying anyone.</li>' +
      '<li><strong>No personal data.</strong> IP addresses, full user-agent strings and query strings are never written to storage. Only coarse geography (country and region, taken from the request) and parsed device, operating system and browser names are kept.</li>' +
      '<li><strong>Privacy signals are honoured.</strong> Visitors with Global Privacy Control or Do Not Track switched on are not measured at all, known bots are discarded before anything is stored, and visits to <code>/admin</code> are never recorded.</li>' +
      '<li><strong>Definitions.</strong> A <em>session</em> ends after 30 minutes of inactivity. <em>Bounce rate</em> counts sessions with a single page view and under 10 seconds of engagement. <em>Engaged time</em> counts only time with the tab visible.</li>' +
      '<li><strong>Reading the range.</strong> <em>New vs returning</em> is judged inside the selected range — a visitor counts as returning when they appear on more than one day. Times of day are UTC.</li>' +
      '</ul></div>';
  }

  function anEmptyState() {
    return '<div class="an-card"><h4><i class="fa-solid fa-satellite-dish"></i> Collection is live — the first numbers are on their way</h4>' +
      '<div class="sub">Nothing has been recorded in this range yet.</div>' +
      '<div class="an-notes">Measurement is switched on for the public site. As soon as people visit, this page fills in: who came, where they arrived from, which parts of the page they read, how long they stayed and what they clicked. ' +
      'Open <a href="/" target="_blank" rel="noopener">the live site</a> in a normal window to see a visit appear within about a minute. Your own visit is not recorded while you are signed in to the studio, and visitors who send a Do Not Track signal are never counted.</div></div>';
  }

  function anExportCsv() {
    var data = anState.data;
    if (!data || !data.report) return;
    var report = data.report;
    var rows = [['section', 'key', 'value']];
    var summary = report.summary || {};
    Object.keys(summary).forEach(function (key) { rows.push(['summary', key, summary[key]]); });
    rows.push(['range', 'from', report.range.from]);
    rows.push(['range', 'to', report.range.to]);
    rows.push(['range', 'days', report.range.days]);
    (report.daily || []).forEach(function (day) {
      ['views', 'visitors', 'sessions', 'bounce', 'avgTime'].forEach(function (key) { rows.push(['daily:' + day.date, key, day[key]]); });
    });
    function dump(section, list) {
      (list || []).forEach(function (entry) { rows.push([section, entry.label, entry.value]); });
    }
    dump('page', report.pages);
    dump('section', report.sections);
    dump('channel', report.acquisition.channels);
    dump('referrer', report.acquisition.referrers);
    dump('campaign', report.acquisition.campaigns);
    dump('country', report.audience.countries);
    dump('region', report.audience.regions);
    dump('device', report.audience.devices);
    dump('browser', report.audience.browsers);
    dump('os', report.audience.os);
    dump('language', report.audience.languages);
    dump('event', report.engagement.events);
    dump('entry', report.engagement.entry);
    dump('exit', report.engagement.exit);
    [25, 50, 75, 100].forEach(function (depth) { rows.push(['scroll', depth + '%', (report.scroll || {})[depth] || 0]); });
    (report.hourly || []).forEach(function (value, hour) { rows.push(['hourly_utc', hour + ':00', value]); });

    var csv = rows.map(function (row) {
      return row.map(function (cell) {
        var text = String(cell == null ? '' : cell);
        return /[",\r\n]/.test(text) ? '"' + text.replace(/"/g, '""') + '"' : text;
      }).join(',');
    }).join('\r\n');

    var url = URL.createObjectURL(new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8' }));
    var link = document.createElement('a');
    link.href = url;
    link.download = 'site-analytics-' + report.range.from + '_' + report.range.to + '.csv';
    document.body.appendChild(link);
    link.click();
    link.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
    toast('Report exported');
  }

  function renderAnalytics(main) {
    main.innerHTML = '';

    var head = document.createElement('div');
    head.className = 'panel-head';
    head.innerHTML = '<h2>Analytics</h2><p>Every visit to the public site — how many people came, where they arrived from, what they read and how far they went. Cookieless and anonymous by design.</p>';
    main.appendChild(head);

    var bar = document.createElement('div');
    bar.className = 'an-bar';

    var ranges = document.createElement('div');
    ranges.className = 'an-ranges';
    AN_RANGES.forEach(function (range) {
      var button = document.createElement('button');
      button.type = 'button';
      button.className = 'an-range' + (anState.days === range.days ? ' on' : '');
      button.textContent = range.label;
      button.addEventListener('click', function () {
        if (anState.days === range.days) return;
        anState.days = range.days;
        anState.data = null;
        renderAnalytics($('#main'));
      });
      ranges.appendChild(button);
    });
    bar.appendChild(ranges);

    bar.appendChild(h('<span class="an-live idle"><span class="beat"></span><span id="anLiveText">Checking who is on the site…</span></span>'));

    var grow = document.createElement('span');
    grow.style.flex = '1';
    bar.appendChild(grow);

    var refresh = h('<button class="btn btn-sm" type="button" id="anRefresh"><i class="fa-solid fa-rotate"></i> Refresh</button>');
    refresh.addEventListener('click', function () { loadAnalytics(true); });
    bar.appendChild(refresh);

    var csv = h('<button class="btn btn-sm" type="button" id="anCsv"><i class="fa-solid fa-file-arrow-down"></i> Export CSV</button>');
    csv.addEventListener('click', function () {
      if (!anState.data) return toast('There is nothing to export yet', 'err');
      anExportCsv();
    });
    bar.appendChild(csv);
    main.appendChild(bar);

    var body = document.createElement('div');
    body.id = 'anBody';
    body.innerHTML = '<div class="an-skel"></div>';
    main.appendChild(body);

    loadAnalytics(false);
  }

  async function loadAnalytics(force) {
    var body = $('#anBody');
    if (!body || anState.loading) return;
    if (anState.data && !force) return anPaint();
    anState.loading = true;
    if (!anState.data) body.innerHTML = '<div class="an-skel"></div>';
    try {
      var data = await api('/api/report?days=' + anState.days);
      anState.data = data;
      anState.at = Date.now();
      anPaint();
    } catch (error) {
      if (state.section === 'analytics') {
        body.innerHTML = '<div class="banner err"><i class="fa-solid fa-triangle-exclamation"></i><div class="grow">' +
          esc(error.message || 'Could not load the analytics.') + '</div></div>' + anNotes();
      }
    } finally {
      anState.loading = false;
      anStartLiveTimer();
    }
  }

  function anStartLiveTimer() {
    if (anState.timer) clearInterval(anState.timer);
    anState.timer = setInterval(function () {
      if (state.section !== 'analytics') return;
      if ($('#app').classList.contains('hidden')) return;
      loadAnalytics(true);
    }, 60000);
  }

  function anPaint() {
    var body = $('#anBody');
    if (!body || !anState.data) return;
    var report = anState.data.report;
    var summary = report.summary || {};
    var live = anState.data.realtime || { minutes: 30, visitors: 0, pageviews: 0, sessions: 0 };

    var liveText = $('#anLiveText');
    if (liveText) {
      liveText.textContent = live.visitors
        ? live.visitors + (live.visitors === 1 ? ' person' : ' people') + ' on the site now · ' + anNum(live.pageviews) + ' page view' + (live.pageviews === 1 ? '' : 's') + ' in the last ' + live.minutes + ' min'
        : 'No one on the site in the last ' + live.minutes + ' minutes';
      liveText.parentNode.className = 'an-live' + (live.visitors ? '' : ' idle');
    }

    if (!summary.pageviews && !summary.visitors) {
      body.innerHTML = anEmptyState() + anNotes();
      return;
    }

    var html = '';

    var kpis = [
      { k: 'Visitors', v: anNum(summary.visitors), s: '<b>' + anNum(summary.newVisitors) + '</b> new · <b>' + anNum(summary.returningVisitors) + '</b> returning', i: 'fa-users' },
      { k: 'Page views', v: anNum(summary.pageviews), s: '<b>' + summary.viewsPerVisitor + '</b> per visitor', i: 'fa-file-lines' },
      { k: 'Sessions', v: anNum(summary.sessions), s: summary.visitors ? '<b>' + (Math.round((summary.sessions / summary.visitors) * 100) / 100) + '</b> per visitor' : '—', i: 'fa-clock' },
      { k: 'Avg. time on site', v: anDuration(summary.avgSessionSeconds), s: '<b>' + anDuration(summary.avgEngagedSeconds) + '</b> engaged', i: 'fa-hourglass-half' },
      { k: 'Pages per session', v: summary.pagesPerSession, s: 'depth of each visit', i: 'fa-layer-group' },
      { k: 'Bounce rate', v: summary.bounceRate + '%', s: 'single-page visits', i: 'fa-arrow-right-from-bracket' },
      { k: 'Returning visitors', v: anShare(summary.returningVisitors, summary.visitors), s: 'of ' + anPlural(summary.visitors, 'visitor', 'visitors'), i: 'fa-repeat' },
      { k: 'Views per session', v: summary.sessions ? Math.round((summary.pageviews / summary.sessions) * 100) / 100 : 0, s: anNum(summary.pageviews) + ' across ' + anPlural(summary.sessions, 'session', 'sessions'), i: 'fa-chart-simple' }
    ];
    html += '<div class="an-kpis">' + kpis.map(function (kpi) {
      return '<div class="an-kpi"><div class="k"><i class="fa-solid ' + kpi.i + '"></i>' + esc(kpi.k) + '</div>' +
        '<div class="v">' + kpi.v + '</div><div class="s">' + kpi.s + '</div></div>';
    }).join('') + '</div>';

    html += '<div class="an-card" id="anChartCard"><h4><i class="fa-solid fa-chart-area"></i> Traffic over time</h4>' +
      '<div class="sub">' + (anState.days === 1 ? 'Page views by hour (UTC), today.' : 'Visitors and page views per day across the selected range.') + '</div>' +
      '<div class="an-chart" id="anChart"></div><div id="anLegend"></div></div>';

    html += '<div class="an-card"><h4><i class="fa-solid fa-clock-rotate-left"></i> Time of day</h4>' +
      '<div class="sub">Page views by hour of the day, UTC, totalled across the range. Useful for timing a post or an announcement.</div>' +
      anHourly(report.hourly || new Array(24).fill(0)) + '</div>';

    html += '<div class="an-grid">';

    html += '<div class="an-card"><h4><i class="fa-solid fa-arrow-trend-up"></i> How people arrive</h4>' +
      '<div class="sub">Grouped by the kind of source that sent the visit.</div>' +
      '<div class="an-sub">Channels</div>' + anList(report.acquisition.channels, { format: function (l) { return l.charAt(0).toUpperCase() + l.slice(1); } }) +
      '<div class="an-sub">Sites that referred them</div>' + anList(report.acquisition.referrers, { empty: 'No referring sites yet — most visits so far went straight to the site.' }) +
      (report.acquisition.campaigns.length ? '<div class="an-sub">Campaigns</div>' + anList(report.acquisition.campaigns) : '') +
      '</div>';

    html += '<div class="an-card"><h4><i class="fa-solid fa-earth-americas"></i> Where they are</h4>' +
      '<div class="sub">Coarse location only — country and region, never a city or address.</div>' +
      '<div class="an-sub">Countries</div>' + anList(report.audience.countries, { format: anCountry }) +
      '<div class="an-sub">Regions</div>' + anList(report.audience.regions, { empty: 'No regional detail yet.' }) +
      '</div>';

    html += '</div>';

    html += '<div class="an-grid">';

    html += '<div class="an-card"><h4><i class="fa-solid fa-mobile-screen"></i> Devices and software</h4>' +
      '<div class="sub">Sessions by device, then the browsers and systems behind them.</div>' +
      anDonut(report.audience.devices) +
      '<div class="an-sub">Browsers</div>' + anList(report.audience.browsers, { mono: false }) +
      '<div class="an-sub">Operating systems</div>' + anList(report.audience.os, { mono: false }) +
      '<div class="an-sub">Languages</div>' + anList(report.audience.languages, { format: anLanguage, empty: 'No language data yet.' }) +
      '</div>';

    html += '<div class="an-card"><h4><i class="fa-solid fa-hand-pointer"></i> Engagement</h4>' +
      '<div class="sub">How far people read, and everything they chose to click.</div>' +
      '<div class="an-sub">Scroll depth</div>' + anScrollFunnel(report.scroll, summary.sessions) +
      '<div class="an-sub">Actions taken</div>' +
      anList((report.engagement.events || []).map(function (e) {
        return { label: AN_EVENT_LABELS[e.label] || e.label, value: e.value };
      }), { format: function (l) { return l; } }) +
      '</div>';

    html += '</div>';

    html += '<div class="an-grid">';

    html += '<div class="an-card"><h4><i class="fa-solid fa-file-lines"></i> Pages people read</h4>' +
      '<div class="sub">The public site is a single page, so these are the parts of it people spent time in.</div>' +
      '<div class="an-sub">Top sections</div>' + anList(report.sections, { format: anPodLabel }) +
      '<div class="an-sub">Pages</div>' + anList(report.pages, { format: function (l) { return l === '/' ? 'Home' : l; } }) +
      '</div>';

    html += '<div class="an-card"><h4><i class="fa-solid fa-right-to-bracket"></i> Arrivals and departures</h4>' +
      '<div class="sub">Where a visit started and where it ended.</div>' +
      '<div class="an-sub">Entry</div>' + anList(report.engagement.entry, { format: anPodLabel }) +
      '<div class="an-sub">Exit</div>' + anList(report.engagement.exit, { format: anPodLabel }) +
      '</div>';

    html += '</div>';

    html += anNotes();

    body.innerHTML = html;

    var labels, series;
    if (anState.days === 1) {
      labels = (report.hourly || []).map(function (_, hour) { return (hour < 10 ? '0' : '') + hour + ':00'; });
      series = [{ name: 'Page views', color: AN_COLORS[0], values: report.hourly || [] }];
    } else {
      var days = report.daily && report.daily.length ? report.daily : report.timeseries;
      labels = days.map(function (day) { return anShortDate(day.date); });
      series = [
        { name: 'Visitors', color: AN_COLORS[0], values: days.map(function (day) { return day.visitors; }) },
        { name: 'Page views', color: AN_COLORS[1], values: days.map(function (day) { return day.views; }) }
      ];
    }

    var chartBox = $('#anChart');
    if (chartBox) anChart(chartBox, labels, series);
    var legendBox = $('#anLegend');
    if (legendBox) legendBox.innerHTML = anLegend(series);
  }

  /* =============================== session =============================== */

  function showLogin(message) {
    state.user = null;
    state.content = null;
    state.base = null;
    $('#app').classList.add('hidden');
    $('#login').classList.remove('hidden');
    if (message) {
      $('#loginErrorText').textContent = message;
      $('#loginError').classList.remove('hidden');
    }
    $('#lgPass').value = '';
  }

  async function signOut() {
    try { await api('/api/logout', { method: 'POST' }); } catch (_) { /* ignore */ }
    showLogin('You have been signed out.');
    toast('Signed out');
  }

  function paintUser() {
    $('#whoName').textContent = state.user.name || state.user.username;
    $('#whoRole').textContent = (state.user.role === 'super' ? 'super admin' : 'editor');
    $('#whoAvatar').textContent = (state.user.name || state.user.username).charAt(0).toUpperCase();
  }

  async function loadContent() {
    var res = await fetch('/api/content', { cache: 'no-store', credentials: 'same-origin' });
    if (!res.ok) throw new Error('Could not load the content (' + res.status + ')');
    var data = await res.json();
    state.sha = res.headers.get('x-content-sha') || null;
    state.content = data;
    state.base = clone(data);
  }

  async function enterStudio() {
    paintUser();
    await loadContent();
    $('#login').classList.add('hidden');
    $('#app').classList.remove('hidden');
    go('hero');
    paintStatus('saved', 'All changes saved');
    if (state.user.role === 'super') {
      loadAdmins().catch(function () { /* handled on the panel */ });
    }
  }

  /* =============================== boot =============================== */

  $('#iconList') ;
  var datalist = document.createElement('datalist');
  datalist.id = 'iconList';
  ICONS.forEach(function (icon) {
    var option = document.createElement('option');
    option.value = icon;
    datalist.appendChild(option);
  });
  document.body.appendChild(datalist);

  $('#loginForm').addEventListener('submit', async function (event) {
    event.preventDefault();
    var button = $('#lgSubmit');
    button.disabled = true;
    $('#loginError').classList.add('hidden');
    try {
      var data = await api('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: $('#lgUser').value, password: $('#lgPass').value })
      });
      state.user = data.user;
      button.disabled = false;
      await enterStudio();
    } catch (error) {
      button.disabled = false;
      $('#loginErrorText').textContent = error.message;
      $('#loginError').classList.remove('hidden');
    }
  });

  $('#saveBtn').addEventListener('click', save);
  $('#discardBtn').addEventListener('click', function () {
    if (!isDirty()) return;
    if (!window.confirm('Discard your unsaved changes?')) return;
    state.content = clone(state.base);
    renderNav(); renderPanel();
    toast('Changes discarded');
  });
  $('#reloadBtn').addEventListener('click', function () {
    loadContent().then(function () { renderNav(); renderPanel(); toast('Reloaded the latest content'); });
  });

  document.addEventListener('keydown', function (event) {
    if ((event.metaKey || event.ctrlKey) && event.key.toLowerCase() === 's') {
      event.preventDefault();
      var panel = state.section;
      if (!$('#app').classList.contains('hidden') && panel !== 'admins' && panel !== 'settings' && panel !== 'analytics') save();
    }
  });

  window.addEventListener('beforeunload', function (event) {
    if (isDirty()) { event.preventDefault(); event.returnValue = ''; }
  });

  (async function boot() {
    try {
      var me = await api('/api/me');
      state.user = me.user;
      await enterStudio();
    } catch (error) {
      showLogin(error.status === 401 ? '' : error.message);
    }
  })();
})();
</script>
</body>
</html>
